name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: CGO_ENABLED=0 go vet -tags '!release' ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans with the toolchain pinned in go.mod, so standard-library findings
      # reflect the Go version that actually builds the binaries.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  test-nocgo:
    name: Test (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: CGO_ENABLED=0 go test -tags '!release' ./... -timeout 15m

  # The same tests on arm64, where the compiler fuses multiply-adds and the
  # math package's assembly differs from amd64. The pinned output hashes
  # (TestCrossArchGolden, internal/detmath TestPinnedBits and the engine and
  # signal pins) must pass unchanged on both, so any dependence of output on
  # the CPU architecture fails CI (docs/CHARTER.md, principle 4).
  test-nocgo-arm64:
    name: Test (CGO_ENABLED=0, arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: CGO_ENABLED=0 go test -tags '!release' ./... -timeout 15m

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build -tags release
        run: CGO_ENABLED=0 go build -tags release ./...

  test-cgo:
    name: Test (CGO, stegano)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo and stegano build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .stegano
          key: stegano-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Build stegano
        run: scripts/build-stegano.sh
      - name: go test
        run: |
          LIB="$PWD/.stegano/target/release"
          CGO_ENABLED=1 CGO_LDFLAGS="-L$LIB -Wl,-rpath,$LIB" \
            go test -tags '!release' ./... -timeout 20m

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f deploy/production/docker/Dockerfile -t phantom-science:ci .
      - name: Smoke test
        run: docker run --rm phantom-science:ci --version
