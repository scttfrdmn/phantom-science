# NovaSeq 6000 S2 Flow Cell Configuration
# Based on Illumina NovaSeq 6000 System Specifications (2024)
# Spec Reference: https://www.illumina.com/systems/sequencing-platforms/novaseq/specifications.html
#
# Fields that affect `generate`: sequencer.run_id and flowcell_id (recorded in
# phantom-manifest.json), sample.*, reads.length, paired_end, reads_per_batch, total_batches,
# performance.max_output_tb/gb (a cap on the bases of each flow cell), the
# illumina section (quality model, sequencing errors, insert size), and the
# optional top-level hmm_model_path, population and model_dir.
# quality.base_quality and quality_decay are used only with
# illumina.quality_model: linear (the default is binned RTA3 qualities). The TUI also reads sequencer.model and
# flow_cell_type for its run timing. Every other field is descriptive and not
# read by the generator; the vendor figures have not been checked against
# current specifications. The other newer settings (seed, platform,
# read_length_distribution, output, ...) are not part of this v1 layout: use a
# JSON or flat YAML config, or command-line flags.

schema_version: "1.0"
last_updated: "2024-07-03"
validated_against: "Illumina NovaSeq 6000 Specs v1.5"
config_type: "sequencer"

# Sequencer Identity and Hardware
sequencer:
  model: "NovaSeq 6000"
  flow_cell_type: "S2"                    # S1, S2, S4 flow cells available
  chemistry_version: "v1.5"               # Latest chemistry as of 2024
  instrument_id: "A00123"                 # Format: A##### for NovaSeq
  run_id: "240101_A00123_0001_BH5TNVDRXY" # Format: YYMMDD_INSTRUMENT_RUN_FLOWCELL
  flowcell_id: "H5TNVDRXY"               # 8-character alphanumeric

# Sample and Run Configuration
sample:
  name: "Sample_001"
  lane: 1                                 # Lane 1-4 for NovaSeq
  output_dir: "./novaseq_s2_output"

# Read Structure and Output
reads:
  length: 150                             # 50, 100, 150, 250bp supported
  paired_end: true                        # Single or paired-end
  reads_per_batch: 20000000              # ~20M reads per batch for S2
  total_batches: 4                       # Total output files to generate
  batch_interval: "2h"                   # Time between batch generations

# Quality Parameters (based on Illumina specs)
quality:
  base_quality: 35                       # Starting Phred score
  quality_decay: 0.05                    # Quality degradation rate (low for NovaSeq)
  q30_percentage: 90.0                   # bases at Q30 or above (descriptive)
  cluster_density_k_per_mm2: 300000     # 300K clusters/mm² for S2 flow cell

# Performance Specifications
performance:
  run_time_hours: 36                     # 2×150bp run time for S2
  max_output_tb: 3.0                     # Maximum data output
  loading_concentration_pm: 1.4          # Typical loading concentration
  phix_spike_in_percent: 1.0             # PhiX control percentage

# Technology Features
technology:
  sbs_version: "v1.5"                    # Sequencing by Synthesis version
  patterned_flow_cell: true              # Uses patterned flow cell technology
  dual_flow_cell_capable: true           # Can run 1 or 2 flow cells
  two_channel_chemistry: true            # NovaSeq 6000 SBS is 2-channel
  four_channel_chemistry: false

# Illumina read model (#27). quality_model: binned (NovaSeq 6000 bins Q2/Q11/Q25/Q37,
# the default) or linear; errors: quality (substitutions at each quality's
# measured rate, Q2 written as N, and indel errors at the profile's measured
# rates; the default for binned), substitutions (no indel errors) or none;
# insert_size: the paired-end fragment length distribution (normal or
# lognormal).
illumina:
  quality_model: binned
  errors: quality
  insert_size:
    dist: normal
    mean: 350
    sd: 50
