# PacBio Revio Sequencer Configuration
# Ultra-high throughput HiFi long-read sequencing platform
# Technical specifications based on 2024 PacBio documentation

version: "2.0"
platform: "pacbio_revio"
vendor: "Pacific Biosciences"
model: "Revio"
chemistry: "SPRQ"

# Platform identification
platform_type: "long_read_hifi"
technology: "SMRT"
release_date: "2023-02-01"

# Core specifications
specifications:
  # Read characteristics
  read_type: "single_end_hifi"  # HiFi reads are consensus reads from single molecules
  read_length:
    min: 10000      # 10 kb minimum
    max: 30000      # Up to 30 kb possible
    average: 17500  # 15-20 kb average, using 17.5 kb
    distribution: "log_normal"  # Long-read length distribution
  
  # Quality specifications
  accuracy:
    consensus_accuracy: 0.999   # >99.9% HiFi accuracy
    median_quality: 30          # Q30 median
    q30_percentage: 90.0        # 90% of bases Q30+
    quality_encoding: "phred33"
  
  # Throughput specifications
  throughput:
    zmw_count: 25000000         # 25M ZMWs per SMRT Cell
    smrt_cells_per_run: 4       # Up to 4 SMRT Cells simultaneously
    daily_output_gb: 480        # 480 Gb HiFi per day
    max_daily_output_tb: 1.4    # 1.4 Tb max theoretical
    raw_reads_per_cell: 15000000  # ~15M raw reads per SMRT Cell
    hifi_output_per_cell_gb: 120  # 100-120 Gb HiFi per SMRT Cell

# Timing specifications
timing:
  run_time_hours: 24          # 24-hour run time typical
  max_run_time_hours: 48      # Extended runs possible
  
  # Phases breakdown
  phases:
    initialization: 2.0       # System initialization
    sample_loading: 1.0       # SMRT Cell loading
    sequencing: 20.0         # Active sequencing
    data_processing: 1.0      # Initial processing
  
  # Time compression support
  compression_factors: [1, 10, 100, 1000]
  default_compression: 100

# Sample requirements
sample_requirements:
  input_dna_ng: 500          # Minimum 500 ng native DNA
  input_dna_optimal_ug: 3    # 3 μg optimal for WGS
  min_fragment_length_kb: 3   # Minimum 3 kb fragments
  sample_volume_ul: 15       # Sample volume

# Cost and capacity
economics:
  genomes_per_year: 2500     # 2,500 human genomes/year capacity
  cost_per_30x_genome_usd: 1000  # <$1,000 per 30x genome target
  consumables_reduction: 0.5  # 50% fewer consumables vs Sequel II

# File generation patterns
output:
  file_format: "fastq"
  compression: "gzip"
  
  # File naming pattern for SMRT sequencing
  # Format: m{instrument}_{run_date}_{run_time}_{cell_position}
  file_pattern: "m{instrument_id}_{run_date}_{run_time}_{cell_pos}.fastq.gz"
  
  # Read ID format for PacBio
  # Format: m{instrument}_{run_date}_{run_time}_{cell_pos}/{zmw}/{ccs_passes}
  read_id_pattern: "m{instrument_id}_{run_date}_{run_time}_{cell_pos}/{zmw}/ccs"

# Hardware specifications
hardware:
  gpu_acceleration: true      # NVIDIA GPU acceleration
  gpu_compute_increase: 20    # 20x compute power vs Sequel IIe
  parallel_processing: true
  real_time_analysis: true

# Quality decay simulation
quality_decay:
  enabled: true
  # HiFi reads maintain high quality throughout due to consensus
  initial_quality: 30
  decay_rate: 0.01           # Very slow decay for consensus reads
  minimum_quality: 20
  position_based: false      # Consensus reads don't show positional bias

# Error patterns (for realistic simulation)
error_patterns:
  insertion_rate: 0.001
  deletion_rate: 0.001  
  substitution_rate: 0.001
  
  # PacBio-specific error characteristics
  homopolymer_errors: true
  homopolymer_error_rate: 0.005  # Slightly higher in homopolymer regions
  systematic_errors: false       # HiFi reduces systematic errors

# Steganographic fingerprinting compatibility
steganography:
  compatible: true
  strategy: "conservative"     # Use conservative approach for high-quality data
  embedding_positions: "quality_scores"
  capacity_estimate: "high"    # Long reads provide good capacity

# Validation parameters
validation:
  statistical_tests:
    - "read_length_distribution"
    - "quality_score_distribution" 
    - "base_composition"
    - "hifi_accuracy_metrics"
  
  expected_metrics:
    mean_read_length: 17500
    median_quality: 30
    q30_percentage: 90.0
    gc_content_range: [35, 65]  # Depends on sample

# Workflow integration
workflows:
  cromwell: true
  nextflow: true
  snakemake: true
  
  # PacBio-specific workflows
  hifi_assembly: true
  structural_variant_calling: true
  methylation_analysis: true
  isoform_sequencing: true

# Notes for implementation
notes: |
  PacBio Revio represents the latest generation of SMRT sequencing technology,
  providing 15x higher throughput than previous generations while maintaining
  exceptional HiFi accuracy. The system uses circular consensus sequencing (CCS)
  to generate HiFi reads that are both long and highly accurate.
  
  Key implementation considerations:
  - HiFi reads are consensus sequences, not raw reads
  - Quality scores reflect consensus confidence, not single-pass quality
  - Read lengths follow log-normal distribution typical of long-read technologies
  - GPU acceleration enables real-time processing and analysis
  - SMRT Cell technology allows single-molecule sequencing without amplification