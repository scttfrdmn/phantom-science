# Phantom Science configuration (v1.0): fingerprinting and validation
#
# Pass with -p to generate (or --phantom-config to tui):
#
#   openssl rand -base64 32 > fingerprint.key && chmod 600 fingerprint.key
#   export PHANTOM_FINGERPRINT_KEY="$(cat fingerprint.key)"   # or set key_file below
#   phantom-science generate --config configs/sequencer/simple-run.json \
#       -p configs/phantom/v1.0/enterprise-settings.yaml --total-reads 1000 --seed 1
#   phantom-science verify sequencer_output/*.fastq
#
# Quality-score fingerprints need a build with the stegano library
# (`make stegano && make build`); without it generation fails before writing
# anything. The fingerprint is encrypted with the key; generation refuses to
# embed without one unless `plaintext: true` is set.
#
# Only the keys below are read. Earlier versions of this file listed audit
# logging, regulatory compliance, academic validation and security sections;
# the generator never read them, so they were removed.

schema_version: "1.0"
last_updated: "2026-10-18"
config_type: "phantom_enterprise"

enterprise:
  customer_id: "CUST_001"                # written into the fingerprint

fingerprinting:
  enable: true
  customer_fingerprint: true             # also tag each read ID with the customer ID
  dataset_fingerprint: false             # tag read IDs with dataset_id (set in the sequencer config)
  steganography_layers:
    - "quality_scores"                   # embed the encrypted fingerprint in the quality scores of each file
  # key_file: "fingerprint.key"          # chmod 600; otherwise $PHANTOM_FINGERPRINT_KEY is used
  # plaintext: true                      # embed a readable fingerprint without a key

# Validation of the generated files. With enable: true and no test lists, the
# built-in suite runs (the same nine checks as `phantom-science validate`).
validation:
  enable: true
  statistical_tests:
    - "format_compliance"
    - "quality_distribution"
    - "sequence_complexity"
    - "read_length_consistency"
  population_genetics_tests:
    - "base_composition"
    - "gc_content"
  pipeline_compatibility_tests:
    - "fastq_parsing"
    - "quality_encoding"
    - "header_format"
