# Long single-end reads with PacBio HiFi-like lengths (flat YAML sequencer config)
#
#   phantom-science generate --config examples/pacbio_revio_example.yaml --total-reads 1000 --seed 1
#
# phantom-science has no PacBio output mode: these reads have Illumina-style
# headers and file names, no PacBio error model, and qualities from
# base_quality and quality_decay. Only the read lengths resemble HiFi reads.
# The v2 template configs/sequencers/pacbio_revio.yaml cannot be generated.
#
# Keys are the JSON field names of types.SequencerConfig (pkg/types/config.go).

sequencer_model: "PacBio Revio"   # descriptive only
sample_name: "HG002_WGS"
lane: 1
output_dir: "./output/pacbio_revio_example"

paired_end: false
read_length: 17500                # used when no distribution is set
reads_per_batch: 150000           # reads per output file
total_batches: 100                # number of output files (15M reads without --total-reads)

read_length_distribution:
  dist: "lognormal"
  mean: 17500
  sd: 3000
  min: 10000
  max: 30000

base_quality: 30
quality_decay: 0.01

output:
  compression: "gzip"
