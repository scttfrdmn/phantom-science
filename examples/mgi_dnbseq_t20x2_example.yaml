# Paired-end 2x150 run named after the MGI DNBSEQ-T20x2 (flat YAML sequencer config)
#
#   phantom-science generate --config examples/mgi_dnbseq_t20x2_example.yaml --total-reads 1000 --seed 1
#
# phantom-science has no MGI output mode: these reads have Illumina-style
# headers and file names, and qualities from base_quality and quality_decay.
# The v2 template configs/sequencers/mgi_dnbseq_t20x2.yaml cannot be generated.
#
# Keys are the JSON field names of types.SequencerConfig (pkg/types/config.go).

sequencer_model: "DNBSEQ-T20x2"   # descriptive only
sample_name: "PopGen_Cohort_Batch1"
lane: 1
output_dir: "./output/mgi_dnbseq_example"

read_length: 150
paired_end: true
reads_per_batch: 2000000          # read pairs per output file
total_batches: 200                # number of output files (400M read pairs without --total-reads)

base_quality: 30
quality_decay: 0.15

workers: 4                        # files generated in parallel; output does not depend on it
