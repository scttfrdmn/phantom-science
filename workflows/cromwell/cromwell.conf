# Cromwell Configuration for Phantom Science
# https://cromwell.readthedocs.io/en/stable/Configuring/

include required(classpath("application"))

# Cromwell server configuration
cromwell {
  backend {
    # Default backend for local execution
    default = "Local"
    
    providers {
      Local {
        actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
        
        config {
          # Enable call caching for better performance
          call-caching {
            enabled = true
            duplication-strategy = "copy"
          }
          
          # Runtime attributes for local execution
          runtime-attributes = """
            String? docker
            Int? memory_mb
            Int? cpu
            Int? disk_mb
            String? mount_point
          """
          
          # Submit job configuration
          submit = "/bin/bash ${script}"
          
          # Job submission directories
          root = "cromwell-executions"
          
          # Docker configuration
          dockerRoot = "/tmp"
          
          # Filesystem configuration
          filesystems {
            local {
              localization: ["soft-link", "hard-link", "copy"]
              
              caching {
                duplication-strategy: ["soft-link", "hard-link", "copy"]
                hashing-strategy: "md5"
              }
            }
          }
        }
      }
      
      # Optional Docker backend configuration
      Docker {
        actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
        
        config {
          call-caching {
            enabled = true
            duplication-strategy = "copy"
          }
          
          runtime-attributes = """
            String? docker
            Int? memory_mb
            Int? cpu
            Int? disk_mb
          """
          
          submit-docker = """
            docker run \
              --rm -i \
              -v ${cwd}:${docker_cwd} \
              -w ${docker_cwd} \
              ${docker} \
              /bin/bash ${script}
          """
          
          root = "cromwell-executions"
          dockerRoot = "/tmp"
          
          filesystems {
            local {
              localization: ["soft-link", "hard-link", "copy"]
              caching {
                duplication-strategy: ["soft-link", "hard-link", "copy"]
                hashing-strategy: "md5"
              }
            }
          }
        }
      }
    }
  }
  
  # Database configuration (in-memory for development)
  database {
    profile = "slick.jdbc.HsqldbProfile$"
    db {
      driver = "org.hsqldb.jdbcDriver"
      url = "jdbc:hsqldb:mem:phantom-science-cromwell;shutdown=false;hsqldb.tx=mvcc"
      connectionTimeout = 1000
      numThreads = 1
    }
  }
  
  # Call caching configuration
  call-caching {
    enabled = true
    invalidate-bad-cache-results = true
  }
  
  # System configuration
  system {
    # Abort configuration
    abort-jobs-on-terminate = true
    
    # Workflow polling
    workflow-heartbeats {
      heartbeat-interval = 2 minutes
      ttl = 10 minutes
    }
    
    # I/O configuration
    io {
      per-workflow-cache-size = 5000
      copy-cache-size = 1000
      throttle = 10
    }
    
    # Memory configuration
    memory-retry {
      enabled = true
      error-keys = ["OutOfMemory", "Killed"]
      multiplier = 2
    }
  }
  
  # Logging configuration
  logging {
    # Log level
    level = "INFO"
    
    # Log to console
    console = true
    
    # Log file configuration
    file {
      enabled = true
      path = "cromwell.log"
      pattern = "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    }
  }
}

# Akka configuration
akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
  
  actor {
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 2
        parallelism-factor = 0.5
        parallelism-max = 4
      }
    }
  }
  
  http {
    server {
      request-timeout = 40s
      bind-timeout = 5s
    }
    
    client {
      connecting-timeout = 10s
      idle-timeout = 60s
    }
  }
}

# Spray configuration
spray {
  can {
    server {
      request-timeout = 40s
      bind-timeout = 5s
    }
    
    client {
      request-timeout = 40s
      connecting-timeout = 10s
      idle-timeout = 60s
    }
  }
}